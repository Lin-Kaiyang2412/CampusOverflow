# 独立验证前端镜像、Nginx 和 Mac 后端代理，不启动第二个后端。
name: campus-overflow-local-web
services:
  web:
    build:
      context: ..
      dockerfile: deploy/frontend.Dockerfile
    ports:
      - "127.0.0.1:8088:80"
    volumes:
      - ./nginx.local.conf:/etc/nginx/conf.d/default.conf:ro
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/healthz"]
      interval: 10s
      timeout: 3s
      retries: 5
