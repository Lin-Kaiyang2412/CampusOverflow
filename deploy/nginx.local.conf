# 本地联调：后端运行在 Mac 的 8080 端口。
server {
    listen 80;
    server_name _;
    client_max_body_size 2m;

    gzip on;
    gzip_types text/css application/javascript application/json;

    # 安全响应头（后端也会设置，这里对静态资源补齐）
    add_header X-Content-Type-Options nosniff;
    add_header X-Frame-Options DENY;
    add_header Referrer-Policy strict-origin-when-cross-origin;

    # SPA 前端：找不到文件时回退到 index.html，交给前端路由
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 'ok';
    }

    location /assets/ {
        root /usr/share/nginx/html;
        try_files $uri =404;
        expires 1y;
    }

    location = /index.html {
        root /usr/share/nginx/html;
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options nosniff;
        add_header X-Frame-Options DENY;
        add_header Referrer-Policy strict-origin-when-cross-origin;
    }

    location / {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;
    }

    # API 反向代理：保持同源，Cookie（SESSION / XSRF-TOKEN）无需跨域配置
    location /api/ {
        proxy_pass http://host.docker.internal:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    location ~ ^/(v3/api-docs|swagger-ui) {
        proxy_pass http://host.docker.internal:8080;
        proxy_set_header Host $host;
    }

    # 只暴露健康检查，其余 actuator 端点不对外开放
    location = /actuator/health {
        proxy_pass http://host.docker.internal:8080/actuator/health;
    }
}
