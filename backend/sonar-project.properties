# CampusOverflow · SonarQube 扫描配置
# 用法（SonarQube 服务已在本地或 Docker 中启动）：
#   cd backend && mvn -B sonar:sonar -Dsonar.host.url=http://localhost:9000 -Dsonar.login=$SONAR_TOKEN
# 覆盖率数据来自 JaCoCo：先跑 `mvn verify -DskipITs`，再执行上面的扫描命令。

sonar.projectKey=campus-overflow
sonar.projectName=CampusOverflow
sonar.projectVersion=0.1.0-SNAPSHOT

sonar.sourceEncoding=UTF-8
sonar.java.source=21
sonar.java.target=21

# 多模块工程：由 Maven 解析各子模块源码，这里只声明排除项
sonar.sources=.
sonar.exclusions=**/target/**,**/*Application.java,**/bootstrap/config/**,**/bootstrap/demo/**,**/test/**

# 测试代码与覆盖率插件
sonar.tests=.
sonar.test.inclusions=**/src/test/java/**/*.java
sonar.java.coveragePlugin=jacoco

# 质量门禁（Lab 7）：覆盖率 > 70%、Bugs = 0、Vulnerabilities = 0
# 门禁阈值在 SonarQube 服务端配置，此处仅声明期望值供评审对照
sonar.qualitygate.wait=false

# 排除规则噪声：DTO/record 的属性命名、启动类无测试属预期
sonar.issue.ignore.multicriteria=e1,e2
sonar.issue.ignore.multicriteria.e1.ruleKey=java:S1118
sonar.issue.ignore.multicriteria.e1.resourceKey=**/*Application.java
sonar.issue.ignore.multicriteria.e2.ruleKey=java:S2094
sonar.issue.ignore.multicriteria.e2.resourceKey=**/*Application.java
