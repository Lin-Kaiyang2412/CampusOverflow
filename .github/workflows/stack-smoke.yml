# 编排冒烟验证：在 CI runner 上把 deploy/docker-compose.yml 的完整容器栈真正跑起来，
# 验证「镜像能启动、依赖顺序正确、健康检查通过、Web 能访问后端」。
#
# 这不是部署。它不碰任何服务器，产物是证据文件（health JSON / compose ps / 日志），
# 用来回答「这套编排到底能不能跑」，而不是「线上在哪」。
#
# 为什么要这个：团队没有可 SSH 的服务器，仓库变量 DEPLOY_ENABLED 也一直没配，
# 导致 ci.yml 里的 deploy job 从未执行过（见 Issue #39）。而 runner 自带 Docker，
# 可以用它把编排跑一遍，拿到与本地 compose 等价的结果。
#
# 默认现场构建镜像（而不是拉 GHCR 上的 latest），原因有两个：
#   1. ci.yml 的 images job 只在 push 时跑，PR 里改了 Dockerfile 也不会更新 latest，
#      拉 latest 等于验的是旧代码；
#   2. 冒烟要回答的是「当前这份代码能不能跑起来」，本地构建才对得上。
# 需要验 GHCR 上的成品镜像时，手动触发并填 image_tag。
name: 编排冒烟（完整容器栈）

on:
  # 手动触发：需要出证据时点一次
  workflow_dispatch:
    inputs:
      image_tag:
        description: "GHCR 镜像标签；留空则现场构建（默认）"
        required: false
        default: ""
        type: string
  # 改动编排文件本身时自动跑一遍：改 compose / nginx / Dockerfile 最容易把栈弄坏，
  # 而这类改动恰恰是普通单测覆盖不到的。只监听这几个路径，避免每个 PR 都跑。
  pull_request:
    paths:
      - "deploy/**"
      - ".github/workflows/stack-smoke.yml"

permissions:
  contents: read
  packages: read

concurrency:
  group: stack-smoke
  cancel-in-progress: false

jobs:
  stack:
    name: 启动容器栈并验证健康
    runs-on: ubuntu-latest
    timeout-minutes: 40

    env:
      COMPOSE_FILE: deploy/docker-compose.yml
      IMAGE_TAG: ${{ github.event.inputs.image_tag }}

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 记录运行环境
        run: |
          mkdir -p evidence
          {
            echo "### 运行环境"
            echo ""
            echo "- 触发方式: ${{ github.event_name }}"
            echo "- 分支/引用: ${{ github.ref }}"
            echo "- 提交: ${{ github.sha }}"
            echo "- 镜像来源: $([ -n "$IMAGE_TAG" ] && echo "GHCR ($IMAGE_TAG)" || echo "现场构建")"
            echo "- 时间(UTC): $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo ""
            echo '```'
            docker version --format 'Docker Engine {{.Server.Version}}'
            docker compose version
            uname -a
            echo '```'
          } > evidence/00-environment.md
          cat evidence/00-environment.md

      - name: 准备镜像（现场构建，或按 image_tag 拉 GHCR）
        run: |
          # set -o pipefail 必须加：否则 `cmd | tee` 的退出码取 tee 的，构建/拉取失败会被吞掉，
          # 表现为「成功」但后面容器起不来（2026-10-30 第一次运行就踩了这个坑）。
          set -o pipefail
          if [ -n "$IMAGE_TAG" ]; then
            backend="ghcr.io/lin-kaiyang2412/campusoverflow-backend:$IMAGE_TAG"
            web="ghcr.io/lin-kaiyang2412/campusoverflow-web:$IMAGE_TAG"
            # 镜像是公开包，匿名即可拉取；显式 pull 便于在启动失败前先暴露拉取问题
            docker compose -f "$COMPOSE_FILE" pull mysql redis backend web 2>&1 | tee evidence/01-pull.log
          else
            # 不设 BACKEND_IMAGE/WEB_IMAGE 时，compose 用 campus-overflow-{backend,web}:local 并现场构建
            backend="campus-overflow-backend:local"
            web="campus-overflow-web:local"
            docker compose -f "$COMPOSE_FILE" build backend web 2>&1 | tee evidence/01-build.log
          fi
          {
            echo "BACKEND_IMAGE=$backend"
            echo "WEB_IMAGE=$web"
          } >> "$GITHUB_ENV"
          docker images --format 'table {{.Repository}}\t{{.Tag}}\t{{.Size}}\t{{.CreatedSince}}' \
            > evidence/02-images.txt
          cat evidence/02-images.txt

      - name: 校验镜像内容（防 COPY 静默空层）
        run: |
          # 2026-10-30 的事故：backend.Dockerfile 里 COPY 的 glob 写错，一个文件都没匹配上，
          # BuildKit 不报错、只产出一个 32 字节的空层，于是镜像「构建成功」而 /app 是空的，
          # 容器启动即 Error: Unable to access jarfile app.jar。
          # 所以这里在启动前先证明镜像里真有东西，把问题定位在构建阶段而不是运行阶段。
          set +e
          {
            echo "### 后端镜像 /app"
            echo '```'
            docker run --rm --entrypoint sh "$BACKEND_IMAGE" -c 'ls -la /app; du -h /app/app.jar' 2>&1
            echo '```'
            echo ""
            echo "### 前端镜像静态文件"
            echo '```'
            docker run --rm --entrypoint sh "$WEB_IMAGE" -c 'ls -la /usr/share/nginx/html' 2>&1
            echo '```'
          } > evidence/02b-image-content.md
          cat evidence/02b-image-content.md

          set -e
          if ! docker run --rm --entrypoint sh "$BACKEND_IMAGE" -c 'test -s /app/app.jar'; then
            echo "::error::后端镜像里没有 app.jar —— 多半是 Dockerfile 的 COPY 匹配了空 glob"
            exit 1
          fi
          if ! docker run --rm --entrypoint sh "$WEB_IMAGE" -c 'test -f /usr/share/nginx/html/index.html'; then
            echo "::error::前端镜像里没有 index.html —— 静态文件没被 COPY 进来"
            exit 1
          fi

      - name: 启动容器栈并等待健康
        run: |
          # --wait 会等到所有带 healthcheck 的服务变 healthy，任一不健康即非零退出。
          set -o pipefail
          docker compose -f "$COMPOSE_FILE" up -d --wait --wait-timeout 300 2>&1 | tee evidence/03-up.log

      - name: 采集健康与可达性证据
        if: always()
        run: |
          set +e
          {
            echo "### compose ps"
            echo '```'
            docker compose -f "$COMPOSE_FILE" ps
            echo '```'
            echo ""
            echo "### docker ps"
            echo '```'
            docker ps --format 'table {{.Names}}\t{{.Image}}\t{{.Status}}\t{{.Ports}}'
            echo '```'
          } > evidence/04-containers.md
          cat evidence/04-containers.md

          echo "--- /actuator/health"
          curl -sS -m 20 -o evidence/05-health.json -w 'HTTP %{http_code}\n' \
            http://localhost:8080/actuator/health | tee evidence/05-health.status.txt
          cat evidence/05-health.json; echo

          echo "--- /actuator/health/readiness"
          curl -sS -m 20 -o evidence/06-readiness.json -w 'HTTP %{http_code}\n' \
            http://localhost:8080/actuator/health/readiness | tee evidence/06-readiness.status.txt
          cat evidence/06-readiness.json; echo

          echo "--- 前端首页"
          curl -sS -m 20 -o /dev/null -w 'HTTP %{http_code}\n' \
            http://localhost/ | tee evidence/07-web.status.txt

          echo "--- 前端 /healthz"
          curl -sS -m 20 -o evidence/08-healthz.txt -w 'HTTP %{http_code}\n' \
            http://localhost/healthz | tee evidence/08-healthz.status.txt

          echo "--- 指标端点"
          curl -sS -m 20 http://localhost:8080/actuator/prometheus \
            | head -40 > evidence/09-metrics.txt
          wc -l < evidence/09-metrics.txt

      - name: 汇总判定
        if: always()
        run: |
          set +e
          backend_code=$(sed -n 's/HTTP //p' evidence/05-health.status.txt 2>/dev/null)
          web_code=$(sed -n 's/HTTP //p' evidence/07-web.status.txt 2>/dev/null)
          running=$(docker compose -f "$COMPOSE_FILE" ps --status running -q 2>/dev/null | wc -l)
          {
            echo "### 判定"
            echo ""
            echo "| 检查项 | 期望 | 实际 |"
            echo "|---|---|---|"
            echo "| 后端 /actuator/health | 200 | ${backend_code:-未取到} |"
            echo "| 前端首页 | 200 | ${web_code:-未取到} |"
            echo "| 运行中容器数 | 4 | ${running} |"
          } | tee evidence/10-verdict.md
          if [ "$backend_code" != "200" ] || [ "$web_code" != "200" ]; then
            echo "::error::健康检查未通过，详见 evidence/05-health.json 与 07-web.status.txt"
            exit 1
          fi

      - name: 诊断镜像内容（仅失败时）
        if: failure()
        run: |
          # 容器起不来时，最需要知道的是镜像里到底有什么。直接进镜像列目录，
          # 比反复猜 Dockerfile 的 COPY 路径快得多。
          set +e
          {
            echo "### 后端镜像 /app 目录"
            echo '```'
            docker run --rm --entrypoint sh "$BACKEND_IMAGE" -c 'pwd; echo ---; ls -la /app; echo ---; ls -la /' 2>&1
            echo '```'
          } > evidence/11-backend-image-ls.md
          cat evidence/11-backend-image-ls.md
          docker image inspect "$BACKEND_IMAGE" \
            --format '{{json .Config.Entrypoint}} {{json .Config.WorkingDir}} {{json .Config.User}}' \
            > evidence/12-backend-image-config.txt 2>&1
          cat evidence/12-backend-image-config.txt

      - name: 收集容器日志
        if: always()
        run: |
          mkdir -p evidence/logs
          for svc in mysql redis backend web; do
            docker compose -f "$COMPOSE_FILE" logs --no-color --tail 400 "$svc" \
              > "evidence/logs/$svc.log" 2>&1
          done
          ls -l evidence/logs

      - name: 上传证据
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stack-smoke-evidence
          path: evidence/
          retention-days: 30
          if-no-files-found: warn

      - name: 清理
        if: always()
        run: docker compose -f "$COMPOSE_FILE" down -v --remove-orphans || true
