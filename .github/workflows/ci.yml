name: CI

on:
  push:
    branches: [main, develop, "sprint/**"]
  pull_request:
    # 所有 base 分支都要跑。此前只写了 [main, develop]，导致以 feature 分支为 base
    # 的 PR（堆叠 PR）完全不触发 CI：GitHub UI 上显示 mergeable_state=CLEAN，
    # 看起来像"检查都过了"，实际上一个检查都没跑过。而堆叠 PR 恰恰是最需要验证的
    # 一类——它们最终会跟着父 PR 一起进 main。改用 "**" 覆盖全部 base 分支。
    branches: ["**"]

permissions:
  contents: read
  packages: write

jobs:
  backend:
    name: Backend build and verification
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: temurin
          cache: maven

      - name: Compile backend
        run: mvn -B -f backend/pom.xml clean compile

      - name: Run backend unit and architecture tests
        run: mvn -B -f backend/pom.xml test

      - name: Verify backend, coverage and integration tests
        run: mvn -B -f backend/pom.xml verify -Djacoco.skip=false

      - name: Upload backend test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-reports
          path: |
            **/target/surefire-reports/*.xml
            **/target/failsafe-reports/*.xml
          if-no-files-found: warn

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci --no-audit --no-fund

      - name: Type check frontend
        working-directory: frontend
        run: npm run typecheck

      # 阶段 1：静态检查（ESLint flat config，--max-warnings=0 即零容忍）
      - name: Lint frontend
        working-directory: frontend
        run: npm run lint

      # 阶段 1.5：格式检查（Prettier）。与 ESLint 分开成一步，格式问题不混在语义检查里报，
      # 定位时能一眼看出是「写得不对」还是「排得不对」。
      # 工具链装在仓库根目录（提交钩子必须作用于整个仓库），故需在根目录单独装依赖。
      # HUSKY=0 跳过钩子安装：CI 里没有提交动作，装了也没用。
      - name: Install repo tooling
        run: npm ci --no-audit --no-fund
        env:
          HUSKY: "0"

      - name: Check frontend formatting
        run: npm run format:check

      # 阶段 1.6：验证提交钩子在 CI 的 Node 版本下真的能拦截（PR #42 评审意见）。
      # 只跑 prettier --check 不能证明 lint-staged 钩子可用——这里显式验证两个方向：
      # 不合规文件必须被拦（非零退出），合规文件必须通过（零退出）。
      - name: Verify pre-commit hook blocks non-compliant commits
        run: |
          set -o pipefail
          probe="frontend/src/__lint_probe.ts"

          # 方向一：不合规文件应被拦截
          printf 'const  probe={a:1,b:2}\n' > "$probe"
          git add -f "$probe"
          if npx lint-staged; then
            echo "::error::lint-staged 未拦截不合规文件，提交钩子失效"
            git reset -q HEAD "$probe"; rm -f "$probe"; exit 1
          fi
          echo "OK: 不合规文件被拦截"
          git reset -q HEAD "$probe"

          # 方向二：合规文件应通过
          printf 'const probe = { a: 1, b: 2 };\n' > "$probe"
          git add -f "$probe"
          if ! npx lint-staged; then
            echo "::error::lint-staged 拒绝了合规文件"
            git reset -q HEAD "$probe"; rm -f "$probe"; exit 1
          fi
          echo "OK: 合规文件通过"
          git reset -q HEAD "$probe"; rm -f "$probe"

      - name: Build frontend
        working-directory: frontend
        run: npm run build

  images:
    name: 容器镜像构建与推送
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    if: github.event_name == 'push'
    permissions:
      contents: read
      packages: write
    outputs:
      backend_latest: ${{ steps.names.outputs.backend }}:latest
      web_latest: ${{ steps.names.outputs.web }}:latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Buildx
        uses: docker/setup-buildx-action@v3

      # GHCR 要求镜像名全小写，而 github.repository 含大写（Lin-Kaiyang2412/CampusOverflow），
      # 所以先算一次小写名，后面构建与部署共用同一个值
      - name: 计算镜像名
        id: names
        run: |
          base=$(echo "ghcr.io/${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          echo "backend=${base}-backend" >> "$GITHUB_OUTPUT"
          echo "web=${base}-web" >> "$GITHUB_OUTPUT"

      - name: 登录 GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 生成后端镜像标签
        id: backend_meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.names.outputs.backend }}
          tags: |
            type=sha,format=short
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: 构建并推送后端镜像
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/backend.Dockerfile
          push: true
          tags: ${{ steps.backend_meta.outputs.tags }}
          labels: ${{ steps.backend_meta.outputs.labels }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

      - name: 生成前端镜像标签
        id: web_meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.names.outputs.web }}
          tags: |
            type=sha,format=short
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: 构建并推送前端镜像
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/frontend.Dockerfile
          push: true
          tags: ${{ steps.web_meta.outputs.tags }}
          labels: ${{ steps.web_meta.outputs.labels }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web

      - name: 汇总镜像地址
        run: |
          {
            echo "### 已推送镜像"
            echo ""
            echo "- backend: \`${{ steps.backend_meta.outputs.tags }}\`"
            echo "- web: \`${{ steps.web_meta.outputs.tags }}\`"
          } >> "$GITHUB_STEP_SUMMARY"

  deploy:
    name: 部署到测试服务器
    runs-on: ubuntu-latest
    needs: [images]
    # 只在 main 推送、且仓库变量 DEPLOY_ENABLED=true 时执行。
    # 没配服务器时这个 job 直接跳过，不会给团队 PR 制造红叉。
    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      vars.DEPLOY_ENABLED == 'true'
    environment:
      name: 测试环境
      url: ${{ vars.DEPLOY_URL }}
    concurrency:
      group: deploy-test-env
      cancel-in-progress: false

    steps:
      - name: 拉取镜像并滚动重启
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ vars.DEPLOY_PORT || 22 }}
          script_stop: true
          script: |
            set -e
            cd "${{ vars.DEPLOY_PATH }}"
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
            export BACKEND_IMAGE="${{ needs.images.outputs.backend_latest }}"
            export WEB_IMAGE="${{ needs.images.outputs.web_latest }}"
            docker compose pull
            docker compose up -d --remove-orphans
            docker image prune -f

      # 冒烟测试失败会让 job 变红，起到"部署后自动验证"的闸门作用
      - name: 部署后冒烟测试（readiness + 首页）
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ vars.DEPLOY_PORT || 22 }}
          script_stop: true
          script: |
            set -e
            echo "等待后端 readiness 就绪（最多 60s）…"
            for i in $(seq 1 30); do
              if curl -fsS http://localhost:8080/actuator/health/readiness > /dev/null 2>&1; then
                echo "backend 已就绪（第 ${i} 次探测）"
                break
              fi
              sleep 2
            done
            echo "--- backend readiness ---"
            curl -fsS http://localhost:8080/actuator/health/readiness
            echo ""
            echo "--- 前端首页 ---"
            curl -fsS -o /dev/null -w "GET / -> %{http_code}\n" http://localhost/
            echo "--- 关键接口 ---"
            curl -fsS -o /dev/null -w "GET /api/v1/questions -> %{http_code}\n" http://localhost/api/v1/questions