name: CI

on:
  push:
    branches: [main, develop, "sprint/**"]
  pull_request:
    # 所有 base 分支都要跑。此前只写了 [main, develop]，导致以 feature 分支为 base
    # 的 PR（堆叠 PR）完全不触发 CI：GitHub UI 上显示 mergeable_state=CLEAN，
    # 看起来像"检查都过了"，实际上一个检查都没跑过。而堆叠 PR 恰恰是最需要验证的
    # 一类——它们最终会跟着父 PR 一起进 main。改用 "**" 覆盖全部 base 分支。
    branches: ["**"]

permissions:
  contents: read

jobs:
  backend:
    name: Backend build and verification
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: temurin
          cache: maven

      - name: Compile backend
        run: mvn -B -f backend/pom.xml clean compile

      - name: Run backend unit and architecture tests
        run: mvn -B -f backend/pom.xml test

      - name: Verify backend, coverage and integration tests
        run: mvn -B -f backend/pom.xml verify -Djacoco.skip=false

      - name: Upload backend test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-reports
          path: |
            **/target/surefire-reports/*.xml
            **/target/failsafe-reports/*.xml
          if-no-files-found: warn

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci --no-audit --no-fund

      - name: Type check frontend
        working-directory: frontend
        run: npm run typecheck

      - name: Build frontend
        working-directory: frontend
        run: npm run build

  images:
    name: Container image build
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    if: github.event_name == 'push'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build backend image
        run: docker build -f deploy/backend.Dockerfile -t campus-overflow-backend:${{ github.sha }} .

      - name: Build frontend image
        run: docker build -f deploy/frontend.Dockerfile -t campus-overflow-web:${{ github.sha }} .