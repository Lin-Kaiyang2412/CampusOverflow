name: CI

on:
  push:
    branches: [main, develop, "sprint/**"]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read
  packages: write

jobs:
  backend:
    name: Backend build and verification
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: temurin
          cache: maven

      - name: Compile backend
        run: mvn -B -f backend/pom.xml clean compile

      - name: Run backend unit and architecture tests
        run: mvn -B -f backend/pom.xml test

      - name: Verify backend, coverage and integration tests
        run: mvn -B -f backend/pom.xml verify -Djacoco.skip=false

      - name: Upload backend test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-reports
          path: |
            **/target/surefire-reports/*.xml
            **/target/failsafe-reports/*.xml
          if-no-files-found: warn

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci --no-audit --no-fund

      - name: Type check frontend
        working-directory: frontend
        run: npm run typecheck

      - name: Build frontend
        working-directory: frontend
        run: npm run build

  images:
    name: 容器镜像构建与推送
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    if: github.event_name == 'push'
    permissions:
      contents: read
      packages: write
    outputs:
      backend_latest: ${{ steps.names.outputs.backend }}:latest
      web_latest: ${{ steps.names.outputs.web }}:latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Buildx
        uses: docker/setup-buildx-action@v3

      # GHCR 要求镜像名全小写，而 github.repository 含大写（Lin-Kaiyang2412/CampusOverflow），
      # 所以先算一次小写名，后面构建与部署共用同一个值
      - name: 计算镜像名
        id: names
        run: |
          base=$(echo "ghcr.io/${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          echo "backend=${base}-backend" >> "$GITHUB_OUTPUT"
          echo "web=${base}-web" >> "$GITHUB_OUTPUT"

      - name: 登录 GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 生成后端镜像标签
        id: backend_meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.names.outputs.backend }}
          tags: |
            type=sha,format=short
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: 构建并推送后端镜像
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/backend.Dockerfile
          push: true
          tags: ${{ steps.backend_meta.outputs.tags }}
          labels: ${{ steps.backend_meta.outputs.labels }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

      - name: 生成前端镜像标签
        id: web_meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.names.outputs.web }}
          tags: |
            type=sha,format=short
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: 构建并推送前端镜像
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/frontend.Dockerfile
          push: true
          tags: ${{ steps.web_meta.outputs.tags }}
          labels: ${{ steps.web_meta.outputs.labels }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web

      - name: 汇总镜像地址
        run: |
          {
            echo "### 已推送镜像"
            echo ""
            echo "- backend: \`${{ steps.backend_meta.outputs.tags }}\`"
            echo "- web: \`${{ steps.web_meta.outputs.tags }}\`"
          } >> "$GITHUB_STEP_SUMMARY"

  deploy:
    name: 部署到测试服务器
    runs-on: ubuntu-latest
    needs: [images]
    # 只在 main 推送、且仓库变量 DEPLOY_ENABLED=true 时执行。
    # 没配服务器时这个 job 直接跳过，不会给团队 PR 制造红叉。
    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      vars.DEPLOY_ENABLED == 'true'
    environment:
      name: 测试环境
      url: ${{ vars.DEPLOY_URL }}
    concurrency:
      group: deploy-test-env
      cancel-in-progress: false

    steps:
      - name: 拉取镜像并滚动重启
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ vars.DEPLOY_PORT || 22 }}
          script_stop: true
          script: |
            set -e
            cd "${{ vars.DEPLOY_PATH }}"
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
            export BACKEND_IMAGE="${{ needs.images.outputs.backend_latest }}"
            export WEB_IMAGE="${{ needs.images.outputs.web_latest }}"
            docker compose pull
            docker compose up -d --remove-orphans
            docker image prune -f

      # 冒烟测试失败会让 job 变红，起到"部署后自动验证"的闸门作用
      - name: 部署后冒烟测试（readiness + 首页）
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ vars.DEPLOY_PORT || 22 }}
          script_stop: true
          script: |
            set -e
            echo "等待后端 readiness 就绪（最多 60s）…"
            for i in $(seq 1 30); do
              if curl -fsS http://localhost:8080/actuator/health/readiness > /dev/null 2>&1; then
                echo "backend 已就绪（第 ${i} 次探测）"
                break
              fi
              sleep 2
            done
            echo "--- backend readiness ---"
            curl -fsS http://localhost:8080/actuator/health/readiness
            echo ""
            echo "--- 前端首页 ---"
            curl -fsS -o /dev/null -w "GET / -> %{http_code}\n" http://localhost/
            echo "--- 关键接口 ---"
            curl -fsS -o /dev/null -w "GET /api/v1/questions -> %{http_code}\n" http://localhost/api/v1/questions